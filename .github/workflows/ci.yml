name: Python checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]" build pip-audit ruff
      - name: Check package dependencies
        run: python -m pip check
      - name: Check Python syntax and blocking lint violations
        run: |
          python -m compileall -q agents blackboard_bus cli.py simulator.py enrichment.py
          ruff check --select E4,E7,E9,F63,F7,F82 .
      - name: Run tests
        run: pytest -q
      - name: Verify installed CLI and distribution
        run: |
          blackboard-bus --help
          python -m build
      - name: Set up Node.js for browser rule tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test browser demo rules
        run: node --test tests/browser.test.mjs
      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off
